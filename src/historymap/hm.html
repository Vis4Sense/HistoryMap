<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>HistoryMap</title>
   <!-- Styles -->
   <link href="hm.css" rel="stylesheet" />
   <link href="./hmTree/tree.css" rel="stylesheet" />
   <!-- Libraries -->
   <script src="../../lib/d3.v7.min.js"></script>
   <script src="../../lib/mxClient.js"></script>
   <script src="../../lib/lodash.core.js"></script>
   <script src="../../lib/tagify/tagify.js"></script>
   <script src="../../lib/tagify//tagify.polyfills.min.js"></script>
   <link href="../../lib/tagify//tagify.css" rel="stylesheet" type="text/css" />
</head>

<body class="container flex flex-col">
   <h1>History Map</h1>

   <!-- Control panel -->
   <div id="control-panel" class="control-panel flex-shrink-0">
      <p>
         <label>Select Tree Layout</label>
         <select id="optionSelect">
            <option value="indented">Indented</option>
            <option value="horizontal">Horizontal</option>
         </select>
      </p>

      <!-- Buttons for saving and loading session -->
      <!-- <div id="session-buttons">
         <p><button id="session-button-save" class="button">Save</button></p>
         <button id="session-button-load" class="button">Load</button>
         <input type="file" id="session-file-input" accept=".json">
      </div> -->      
   </div>

   <!-- HistoryMap View container -->
   <div id="hm-view-container" class="flex-auto overflow-y-scroll">
      <div class="flex flex-row justify-center">
         <div class="loader" id="loading-icon"></div>
         <div id="loading-tip">Scroll up to view earlier pages</div>
      </div>
      <div id="hm-tree-view" ></div>
   </div>

   <!-- Example data for debugging -->
   <script src="./dataExample.js"></script>

   <!-- Scripts -->
   <script src="./hmTree/utils.js"></script>
   <script src="./hmTree/layouts/compactTree.js"></script>
   <script src="./hmTree/layouts/indentedTress.js"></script>
   <script src="./hmTree/layouts/index.js"></script>
   <script src="./hmTree/node.js"></script>
   <script src="./hmTree/nodeMenu.js"></script>
   <script src="./hmTree/view.js"></script>
   <script src="hmController.js"></script>
   <script src="hmControllerUtils.js"></script>
   <script src="hmControllerTree.js"></script>
   <script src="hmControllerHighlight.js"></script>
   <script src="hmModel.js"></script>
   <script src="hmControlPanel.js"></script>

   <!-- Scripts for saving and loading sessoin -->
   <script src="hmSessionSave.js"></script>
   <script src="hmSessionLoad.js"></script>
</body>

</html>
